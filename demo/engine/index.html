<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Groundwork engine — pack viewer</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: #0a0e14; overflow: hidden; }
      body {
        font: 13px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        color: #c8ccd4;
      }
      canvas { display: block; }
      #panel {
        position: fixed; top: 16px; left: 16px; width: 330px; padding: 16px 18px;
        background: rgba(12, 17, 24, 0.9); border: 1px solid #23303f; border-radius: 6px;
        backdrop-filter: blur(6px); max-height: calc(100vh - 32px); overflow-y: auto;
      }
      h1 { margin: 0 0 2px; font-size: 15px; font-weight: 600; color: #e8ecf2; }
      .sub { margin: 0 0 14px; color: #7b8798; font-size: 12px; }
      input[type=file] { width: 100%; font: inherit; color: #9aa5b4; }
      #drop {
        margin-top: 10px; padding: 18px 12px; border: 1px dashed #2f3f52; border-radius: 5px;
        text-align: center; color: #6f7b8c; transition: all .12s;
      }
      #drop.over { border-color: #e0a63a; color: #e0a63a; background: rgba(224,166,58,.06); }
      #status { margin-top: 12px; min-height: 18px; color: #e0a63a; }
      #status.err { color: #e06a4a; }
      dl { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; margin: 12px 0 0; }
      dt { color: #6f7b8c; }
      dd { margin: 0; color: #c8ccd4; text-align: right; font-variant-numeric: tabular-nums; }
      .note {
        margin: 14px 0 0; padding-top: 12px; border-top: 1px solid #1c2732;
        color: #6f7b8c; font-size: 11.5px;
      }
      .attrib { margin-top: 8px; color: #5f6b7c; font-size: 11px; }
      label.row { display: flex; align-items: center; gap: 8px; margin-top: 8px; color: #9aa5b4; }
      label.row input { accent-color: #e0a63a; }
    </style>
  </head>
  <body>
    <div id="panel">
      <h1>Groundwork engine</h1>
      <p class="sub">Renders a <code>.gwpack</code>. No builder code in this page.</p>

      <input id="file" type="file" accept=".gwpack,.zip" />
      <div id="drop">or drop a pack here</div>
      <div id="status"></div>

      <dl id="info"></dl>
      <label class="row"><input id="roads" type="checkbox" checked /> Draw pack road vectors</label>

      <p class="note">
        This page imports <code>@groundwork/engine</code> and <code>@groundwork/core</code> and
        nothing else. If it ever needs a line from <code>src/</code>, the split has leaked.
      </p>
      <div class="attrib" id="attrib"></div>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
